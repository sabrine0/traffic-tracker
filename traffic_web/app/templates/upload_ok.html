<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Uploaded - Traffic Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="nav">
    <div class="brand">Traffic Tracker</div>
    <div class="nav-links">
      {% if user %}
        <a href="/">Home</a>
        <a href="/admin">Dashboard</a>
        {% if user.role != 'viewer' %}
          <a href="/upload">New Run</a>
          <a href="/upload">Upload</a>
        {% endif %}
        <a href="/jobs">Videos</a>
      {% else %}
        <a href="/admin/login">Login</a>
      {% endif %}
    </div>
  </div>

  <div class="container">
    <div class="card">
      <span class="tag">Uploaded</span>
      <h2>Upload Complete</h2>
      <p>Video: <code>{{ job_id }}</code></p>
      <p>Saved as: <code>{{ saved_as }}</code></p>
      <p>File path: <code>{{ file_path }}</code></p>
      <p>Next step: draw zones, then process.</p>

      <a class="btn btn-primary" href="{{ next_url }}">Go to Results</a>
    </div>
  </div>
</body>
</html>
