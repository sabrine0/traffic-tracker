{% extends "admin/base.html" %}
{% block content %}
  <h1>My Profile</h1>
  {% if error %}
    <div class="tag" style="background:#ffecec; color:#b00020; border-color:#f5c2c7;">
      {{ error }}
    </div>
  {% endif %}
  {% if success %}
    <div class="tag" style="background:#e9f7ef; color:#1e6f3d; border-color:#cfe9dc;">
      {{ success }}
    </div>
  {% endif %}
  <div class="box">
    <form method="post">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Email</label>
      <input type="email" name="email" required value="{{ form.email or '' }}" style="width:100%; padding:8px; margin-bottom:12px;">

      <label style="display:block; font-weight:600; margin-bottom:6px;">Username</label>
      <input type="text" name="username" required value="{{ form.username or '' }}" style="width:100%; padding:8px; margin-bottom:12px;">

      <label style="display:block; font-weight:600; margin-bottom:6px;">Full Name</label>
      <input type="text" name="full_name" value="{{ form.full_name or '' }}" style="width:100%; padding:8px; margin-bottom:12px;">

      <label style="display:block; font-weight:600; margin-bottom:6px;">New Password</label>
      <input type="password" name="new_password" placeholder="Leave blank to keep current" style="width:100%; padding:8px; margin-bottom:12px;">

      <div class="tag" style="margin-bottom:12px;">Role: {{ user.role }}</div>

      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline" href="/admin">Cancel</a>
    </form>
  </div>
{% endblock %}
